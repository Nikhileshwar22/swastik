<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <linearGradient id="wg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#ead8c0"/>
    </linearGradient>
    <linearGradient id="fg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a87848"/>
      <stop offset="100%" stop-color="#885a28"/>
    </linearGradient>
    <linearGradient id="accentWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8703a"/>
      <stop offset="100%" stop-color="#b86030"/>
    </linearGradient>
    <filter id="ds2">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#00000028"/>
    </filter>
  </defs>

  <!-- Warm cream wall -->
  <rect width="1024" height="768" fill="url(#wg2)"/>

  <!-- Feature accent wall - terracotta/saffron -->
  <rect x="0" y="0" width="280" height="580" fill="url(#accentWall)" opacity="0.8"/>
  <!-- Jali-inspired pattern on accent wall -->
  <g opacity="0.15" fill="#fff">
    <rect x="20" y="30" width="12" height="12" rx="2"/>
    <rect x="50" y="30" width="12" height="12" rx="2"/>
    <rect x="80" y="30" width="12" height="12" rx="2"/>
    <rect x="110" y="30" width="12" height="12" rx="2"/>
    <rect x="140" y="30" width="12" height="12" rx="2"/>
    <rect x="170" y="30" width="12" height="12" rx="2"/>
    <rect x="200" y="30" width="12" height="12" rx="2"/>
    <rect x="230" y="30" width="12" height="12" rx="2"/>
    <rect x="35" y="55" width="12" height="12" rx="2"/>
    <rect x="65" y="55" width="12" height="12" rx="2"/>
    <rect x="95" y="55" width="12" height="12" rx="2"/>
    <rect x="125" y="55" width="12" height="12" rx="2"/>
    <rect x="155" y="55" width="12" height="12" rx="2"/>
    <rect x="185" y="55" width="12" height="12" rx="2"/>
    <rect x="215" y="55" width="12" height="12" rx="2"/>
    <rect x="245" y="55" width="12" height="12" rx="2"/>
    <rect x="20" y="80" width="12" height="12" rx="2"/>
    <rect x="50" y="80" width="12" height="12" rx="2"/>
    <rect x="80" y="80" width="12" height="12" rx="2"/>
    <rect x="110" y="80" width="12" height="12" rx="2"/>
    <rect x="140" y="80" width="12" height="12" rx="2"/>
    <rect x="170" y="80" width="12" height="12" rx="2"/>
    <rect x="200" y="80" width="12" height="12" rx="2"/>
    <rect x="230" y="80" width="12" height="12" rx="2"/>
  </g>

  <!-- Teak wood floor -->
  <polygon points="0,545 1024,495 1024,768 0,768" fill="url(#fg2)"/>
  <line x1="0" y1="590" x2="1024" y2="545" stroke="#784818" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="635" x2="1024" y2="593" stroke="#784818" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="680" x2="1024" y2="643" stroke="#784818" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="725" x2="1024" y2="694" stroke="#784818" stroke-width="1" opacity="0.5"/>
  <line x1="160" y1="545" x2="160" y2="768" stroke="#784818" stroke-width="1" opacity="0.3"/>
  <line x1="320" y1="545" x2="320" y2="768" stroke="#784818" stroke-width="1" opacity="0.3"/>
  <line x1="480" y1="545" x2="480" y2="768" stroke="#784818" stroke-width="1" opacity="0.3"/>
  <line x1="640" y1="545" x2="640" y2="768" stroke="#784818" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="545" x2="800" y2="768" stroke="#784818" stroke-width="1" opacity="0.3"/>
  <line x1="960" y1="545" x2="960" y2="768" stroke="#784818" stroke-width="1" opacity="0.3"/>

