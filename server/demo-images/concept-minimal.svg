<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf8"/>
      <stop offset="100%" stop-color="#f0f0ec"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e0d4"/>
      <stop offset="100%" stop-color="#d0c8bc"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="100%" stop-color="#e0dcd4"/>
    </linearGradient>
    <filter id="fs">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000015"/>
    </filter>
  </defs>

  <!-- Pure white wall -->
  <rect width="1024" height="768" fill="url(#wg)"/>

  <!-- Floor -->
  <polygon points="0,540 1024,490 1024,768 0,768" fill="url(#fg)"/>
  <!-- Subtle floor lines - polished concrete look -->
  <line x1="0" y1="580" x2="1024" y2="535" stroke="#d8d0c8" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="620" x2="1024" y2="578" stroke="#d8d0c8" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="660" x2="1024" y2="622" stroke="#d8d0c8" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="700" x2="1024" y2="666" stroke="#d8d0c8" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="740" x2="1024" y2="710" stroke="#d8d0c8" stroke-width="1" opacity="0.6"/>

  <!-- Full height windows - minimal frame -->
  <rect x="60" y="0" width="220" height="550" fill="#e4eff8" opacity="0.4"/>
  <rect x="60" y="0" width="2" height="550" fill="#d0ccc4"/>
  <rect x="278" y="0" width="2" height="550" fill="#d0ccc4"/>
  <rect x="166" y="0" width="2" height="550" fill="#d0ccc4" opacity="0.4"/>

  <rect x="340" y="0" width="220" height="550" fill="#e4eff8" opacity="0.4"/>
  <rect x="340" y="0" width="2" height="550" fill="#d0ccc4"/>
  <rect x="558" y="0" width="2" height="550" fill="#d0ccc4"/>

  <!-- Light beams -->
  <polygon points="62,0 278,0 320,768 20,768" fill="#fff8f0" opacity="0.07"/>
  <polygon points="342,0 558,0 600,768 300,768" fill="#fff8f0" opacity="0.07"/>

  <!-- Clean low-profile sofa -->
  <rect x="200" y="456" width="580" height="100" fill="url(#sg)" rx="4" filter="url(#fs)"/>
  <rect x="200" y="430" width="580" height="32" fill="#e8e4de" rx="3"/>
  <!-- Arm left -->
  <rect x="192" y="436" width="24" height="120" fill="#e0dcd6" rx="3"/>
  <!-- Arm right -->
  <rect x="764" y="436" width="24" height="120" fill="#e0dcd6" rx="3"/>
  <!-- Cushions -->
  <rect x="214" y="434" width="170" height="26" fill="#ebe7e1" rx="2"/>
  <rect x="392" y="434" width="170" height="26" fill="#ebe7e1" rx="2"/>
  <rect x="570" y="434" width="186" height="26" fill="#ebe7e1" rx="2"/>
  <!-- Sofa legs - thin metal -->
  <rect x="210" y="554" width="6" height="12" fill="#888078"/>
  <rect x="360" y="554" width="6" height="12" fill="#888078"/>
  <rect x="510" y="554" width="6" height="12" fill="#888078"/>
  <rect x="760" y="554" width="6" height="12" fill="#888078"/>

  <!-- Minimal stone coffee table -->
  <rect x="320" y="540" width="300" height="10" fill="#c8c4bc" rx="1" filter="url(#fs)"/>
  <!-- Table surface detail - stone veining -->
  <rect x="321" y="541" width="298" height="8" fill="#d0ccc4"/>
  <line x1="360" y1="541" x2="400" y2="549" stroke="#b8b4ac" stroke-width="0.8" opacity="0.5"/>
  <line x1="480" y1="541" x2="530" y2="549" stroke="#b8b4ac" stroke-width="0.8" opacity="0.5"/>
  <!-- Table legs -->
  <rect x="336" y="548" width="6" height="30" fill="#a0a098"/>
  <rect x="598" y="548" width="6" height="30" fill="#a0a098"/>

  <!-- Accent chair -->
  <rect x="820" y="450" width="120" height="100" fill="#e8e2da" rx="4" filter="url(#fs)"/>
  <rect x="820" y="426" width="120" height="30" fill="#f0ece6" rx="3"/>
  <!-- Chair legs -->
  <rect x="828" y="548" width="6" height="14" fill="#888078"/>
  <rect x="928" y="548" width="6" height="14" fill="#888078"/>

  <!-- Minimal side table -->
  <rect x="100" y="490" width="80" height="10" fill="#c8c4bc" rx="1"/>
  <rect x="136" y="498" width="6" height="50" fill="#a0a098" rx="1"/>

  <!-- Architectural pendant - single orb -->
  <line x1="512" y1="0" x2="512" y2="110" stroke="#a0a098" stroke-width="1.5"/>
  <circle cx="512" cy="122" r="18" fill="#f0ece6" stroke="#c8c4bc" stroke-width="1"/>
  <circle cx="512" cy="122" r="12" fill="#fff8e8" opacity="0.8"/>
  <!-- Glow -->
  <ellipse cx="512" cy="140" rx="60" ry="20" fill="#ffe8a0" opacity="0.12"/>

  <!-- Wall art - single large minimal piece -->
  <rect x="640" y="80" width="280" height="360" fill="#f5f3f0" stroke="#e0dcd8" stroke-width="1.5"/>
  <rect x="650" y="90" width="260" height="340" fill="#f0eee9"/>
  <!-- Abstract line art -->
  <line x1="720" y1="140" x2="850" y2="380" stroke="#c8c4bc" stroke-width="1.5"/>
  <line x1="700" y1="200" x2="870" y2="320" stroke="#d0ccc4" stroke-width="1"/>
  <circle cx="770" cy="260" r="40" fill="none" stroke="#c0bcb4" stroke-width="1.5"/>
  <circle cx="770" cy="260" r="20" fill="none" stroke="#c8c4bc" stroke-width="1"/>

  <!-- Minimal vase on table -->
  <rect x="116" y="455" width="14" height="35" fill="#b0aca4" rx="4"/>
  <ellipse cx="123" cy="456" rx="10" ry="4" fill="#c0bcb4"/>

  <!-- Books on coffee table -->
  <rect x="340" y="528" width="60" height="12" fill="#c8c0b4" rx="1" opacity="0.7"/>
  <rect x="340" y="524" width="55" height="4" fill="#b8b0a4" rx="1" opacity="0.5"/>

  <!-- Label -->
  <rect x="20" y="720" width="200" height="36" fill="#1c1917" opacity="0.75" rx="4"/>
  <text x="120" y="743" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#f5f0e8" font-weight="400" letter-spacing="2">MINIMAL PREMIUM</text>
</svg>
