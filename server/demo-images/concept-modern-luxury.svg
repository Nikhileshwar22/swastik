<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="60%" stop-color="#e8d5b0"/>
      <stop offset="100%" stop-color="#f5efe0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6f47"/>
      <stop offset="100%" stop-color="#6b5232"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8ddd0"/>
      <stop offset="50%" stop-color="#f0e8d8"/>
      <stop offset="100%" stop-color="#d8cfc0"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b89a"/>
      <stop offset="100%" stop-color="#a89070"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ede8"/>
      <stop offset="40%" stop-color="#e8e4de"/>
      <stop offset="100%" stop-color="#d8d4cc"/>
    </linearGradient>
    <linearGradient id="ceilingLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe8a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000030"/>
    </filter>
  </defs>

  <!-- Background wall -->
  <rect width="1024" height="768" fill="url(#wall)"/>

  <!-- Ceiling cove lighting effect -->
  <rect x="0" y="0" width="1024" height="120" fill="url(#ceilingLight)" opacity="0.6"/>
  <rect x="0" y="0" width="1024" height="8" fill="#c8b898" opacity="0.4"/>

  <!-- Floor -->
  <polygon points="0,580 1024,520 1024,768 0,768" fill="url(#floor)"/>
  <!-- Wood floor lines -->
  <line x1="0" y1="620" x2="1024" y2="565" stroke="#7a6040" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="660" x2="1024" y2="610" stroke="#7a6040" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="700" x2="1024" y2="655" stroke="#7a6040" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="740" x2="1024" y2="700" stroke="#7a6040" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="580" x2="120" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>
  <line x1="240" y1="580" x2="240" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>
  <line x1="360" y1="580" x2="360" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>
  <line x1="480" y1="580" x2="480" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="580" x2="600" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>
  <line x1="720" y1="580" x2="720" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>
  <line x1="840" y1="580" x2="840" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>
  <line x1="960" y1="580" x2="960" y2="768" stroke="#7a6040" stroke-width="1" opacity="0.3"/>

  <!-- Back wall paneling -->
  <rect x="60" y="100" width="180" height="460" fill="#e0d5c5" opacity="0.5" rx="2"/>
  <rect x="260" y="100" width="180" height="460" fill="#e0d5c5" opacity="0.5" rx="2"/>
  <rect x="580" y="100" width="200" height="460" fill="#e0d5c5" opacity="0.5" rx="2"/>
  <rect x="800" y="100" width="164" height="460" fill="#e0d5c5" opacity="0.5" rx="2"/>

  <!-- Large window with light -->
  <rect x="440" y="80" width="300" height="420" fill="#c8dde8" opacity="0.6" rx="2"/>
  <rect x="440" y="80" width="300" height="420" fill="url(#sky)" opacity="0.5"/>
  <!-- Window frame -->
  <rect x="440" y="80" width="8" height="420" fill="#b8a888"/>
  <rect x="732" y="80" width="8" height="420" fill="#b8a888"/>
  <rect x="440" y="80" width="300" height="8" fill="#b8a888"/>
  <rect x="440" y="492" width="300" height="8" fill="#b8a888"/>
  <rect x="586" y="80" width="4" height="420" fill="#b8a888" opacity="0.6"/>
  <!-- Light beam from window -->
  <polygon points="440,80 740,80 900,768 280,768" fill="#fff8e8" opacity="0.08"/>

  <!-- TV Wall / Feature wall -->
  <rect x="60" y="120" width="340" height="400" fill="#2c2420" rx="3"/>
  <rect x="70" y="130" width="320" height="360" fill="#1a1210" rx="2"/>
  <!-- TV screen -->
  <rect x="90" y="160" width="280" height="200" fill="#0a0808" rx="2"/>
  <rect x="92" y="162" width="276" height="196" fill="#0f1520" rx="1" opacity="0.8"/>
  <!-- TV unit base -->
  <rect x="80" y="380" width="300" height="30" fill="#3a2e28" rx="2"/>
  <rect x="90" y="408" width="40" height="50" fill="#2c2420" rx="1"/>
  <rect x="330" y="408" width="40" height="50" fill="#2c2420" rx="1"/>

  <!-- Large sectional sofa -->
  <rect x="220" y="470" width="580" height="120" fill="url(#sofa)" rx="8" filter="url(#shadow)"/>
  <rect x="220" y="440" width="580" height="40" fill="#d4c4a8" rx="6"/>
  <!-- Sofa back cushions -->
  <rect x="235" y="445" width="120" height="32" fill="#ddd0b8" rx="4" opacity="0.8"/>
  <rect x="365" y="445" width="120" height="32" fill="#ddd0b8" rx="4" opacity="0.8"/>
  <rect x="495" y="445" width="120" height="32" fill="#ddd0b8" rx="4" opacity="0.8"/>
  <rect x="625" y="445" width="160" height="32" fill="#ddd0b8" rx="4" opacity="0.8"/>
  <!-- Sofa arm left -->
  <rect x="210" y="450" width="30" height="140" fill="#c0a880" rx="6"/>
  <!-- Sofa arm right -->
  <rect x="790" y="450" width="30" height="140" fill="#c0a880" rx="6"/>
  <!-- Seat cushions -->
  <rect x="240" y="480" width="170" height="90" fill="#cdb898" rx="4" opacity="0.7"/>
  <rect x="420" y="480" width="170" height="90" fill="#cdb898" rx="4" opacity="0.7"/>
  <rect x="600" y="480" width="180" height="90" fill="#cdb898" rx="4" opacity="0.7"/>

  <!-- Marble coffee table -->
  <rect x="310" y="540" width="280" height="12" fill="url(#marble)" rx="2" filter="url(#shadow)"/>
  <rect x="320" y="550" width="260" height="40" fill="#e8e4de" opacity="0.4"/>
  <rect x="330" y="552" width="8" height="36" fill="#c8c4bc"/>
  <rect x="562" y="552" width="8" height="36" fill="#c8c4bc"/>

  <!-- Pendant lights -->
  <line x1="200" y1="0" x2="200" y2="100" stroke="#888070" stroke-width="1.5"/>
  <ellipse cx="200" cy="108" rx="20" ry="12" fill="#d4b860" filter="url(#glow)"/>
  <line x1="500" y1="0" x2="500" y2="80" stroke="#888070" stroke-width="1.5"/>
  <ellipse cx="500" cy="88" rx="20" ry="12" fill="#d4b860" filter="url(#glow)"/>
  <line x1="820" y1="0" x2="820" y2="100" stroke="#888070" stroke-width="1.5"/>
  <ellipse cx="820" cy="108" rx="20" ry="12" fill="#d4b860" filter="url(#glow)"/>

  <!-- Decorative plant -->
  <rect x="840" y="440" width="25" height="80" fill="#6b5230" rx="2"/>
  <rect x="828" y="510" width="49" height="20" fill="#7a6040" rx="3"/>
  <ellipse cx="852" cy="420" rx="45" ry="60" fill="#2d5a27" opacity="0.8"/>
  <ellipse cx="832" cy="390" rx="30" ry="45" fill="#3a6e32" opacity="0.7"/>
  <ellipse cx="872" cy="400" rx="28" ry="40" fill="#2d5a27" opacity="0.7"/>

  <!-- Artwork on wall -->
  <rect x="800" y="150" width="130" height="180" fill="#f0ede8" stroke="#c8b898" stroke-width="3" rx="1"/>
  <rect x="810" y="160" width="110" height="160" fill="#e8e0d0"/>
  <ellipse cx="865" cy="240" rx="30" ry="40" fill="#c8a870" opacity="0.6"/>
  <rect x="835" y="270" width="60" height="20" fill="#b89050" opacity="0.4"/>

  <!-- Decorative vase on coffee table -->
  <rect x="410" y="505" width="16" height="35" fill="#b8a080" rx="3"/>
  <ellipse cx="418" cy="505" rx="12" ry="5" fill="#c8b090"/>
  <ellipse cx="418" cy="540" rx="8" ry="4" fill="#a89070"/>

  <!-- Cove lighting glow at ceiling -->
  <rect x="0" y="0" width="1024" height="30" fill="#ffe8b0" opacity="0.15"/>

  <!-- Label -->
  <rect x="20" y="720" width="220" height="36" fill="#1c1917" opacity="0.75" rx="4"/>
  <text x="130" y="743" font-family="Georgia, serif" font-size="13" text-anchor="middle" fill="#f5f0e8" font-weight="400" letter-spacing="2">WARM MODERN LUXURY</text>
</svg>
